{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Prato Cheio</title>
    <link rel="stylesheet" href="{% static 'users/css/login.css' %}">
</head>
<body>
    <main class="login">
        <div class="login-card">
            <header class="login-header">
                <h1 class="login-brand">Prato Cheio</h1>
                <p class="login-subtitle">Entre na sua conta</p>
            </header>

            {% if messages %}
            <ul class="login-messages" role="alert">
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}

            <form class="login-form" method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="o-seu-email@exemplo.com"
                           autocomplete="email" required autofocus>
                </div>

                <div class="field">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password"
                           placeholder="Digite a sua senha"
                           autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
                {% if sms %}
                            <p class="sms {{ tipo }}" role="alert">{{ sms }}</p>
                {% endif %}
            </form>

            <p class="login-footer">
                <a href="#">Esqueceu a senha?</a>
            </p>
        </div>
    </main>
</body>
</html>
